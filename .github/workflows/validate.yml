name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - run: node skills/zx-workflow-author/scripts/validate-skill.mjs

      - run: node skills/zx-workflow-evolver/scripts/validate-skill.mjs

      - run: node skills/zx-repository-issue-workflow/scripts/validate-skill.mjs

      - run: node skills/zx-prompt-solver/scripts/validate-skill.mjs
